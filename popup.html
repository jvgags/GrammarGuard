<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GrammarGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="src/popup.css"/>
</head>
<body>
<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
          <path d="M3 6h16M3 11h10M3 16h13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">GrammarGuard</span>
    </div>

    <!-- Language -->
    <div class="sidebar-section">
      <div class="section-label">Language</div>
      <select id="langSelect">
        <option value="auto">Auto-detect</option>
        <option value="en-US" selected>English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-AU">English (AU)</option>
        <option value="de-DE">German</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="pt-BR">Portuguese (BR)</option>
        <option value="it">Italian</option>
        <option value="nl">Dutch</option>
        <option value="pl">Polish</option>
        <option value="ru">Russian</option>
      </select>
    </div>

    <!-- Theme -->
    <div class="sidebar-section">
      <div class="section-label">Theme</div>
      <div class="theme-grid">
        <button class="theme-btn active" data-theme="light"     title="Light">Light</button>
        <button class="theme-btn"        data-theme="dark"      title="Dark">Dark</button>
        <button class="theme-btn"        data-theme="sepia"     title="Sepia">Sepia</button>
        <button class="theme-btn"        data-theme="contrast"  title="High Contrast">Hi-Con</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="sidebar-section" id="statsSection" style="display:none">
      <div class="section-label">Results</div>
      <div class="stats-grid">
        <div class="stat-box red">   <span id="nErrors">0</span>  <label>Spelling</label></div>
        <div class="stat-box amber"> <span id="nGrammar">0</span> <label>Grammar</label></div>
        <div class="stat-box blue">  <span id="nStyle">0</span>   <label>Style</label></div>
        <div class="stat-box gray">  <span id="nTotal">0</span>   <label>Total</label></div>
      </div>
    </div>

    <!-- Filter -->
    <div class="sidebar-section" id="filterSection" style="display:none">
      <div class="section-label">Filter</div>
      <div class="filter-btns">
        <button class="fbtn active" data-f="all">All</button>
        <button class="fbtn" data-f="spelling">Spelling</button>
        <button class="fbtn" data-f="grammar">Grammar</button>
        <button class="fbtn" data-f="style">Style</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="sidebar-actions">
      <button class="btn-primary" id="checkBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>
        </svg>
        Check Now
      </button>
      <button class="btn-ghost" id="clearBtn">Clear</button>
    </div>

    <div class="sidebar-footer">
      Powered by <a href="https://languagetool.org" target="_blank">LanguageTool</a>
      &nbsp;·&nbsp;
      <a href="#" id="settingsLink">Settings</a>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Top bar -->
    <div class="topbar">
      <div id="statusBar" class="status-idle">
        <span class="status-dot"></span>
        <span id="statusMsg">Ready — paste text and click Check Now</span>
      </div>
      <div class="topbar-right">
        <span id="charCount" class="char-count">0 chars</span>
        <button class="btn-sm" id="clearTextBtn">Clear text</button>
      </div>
    </div>

    <!-- Editor -->
    <div class="editor-area">
      <div class="editor-wrap" id="editorWrap">
        <div id="mirror" class="mirror" aria-hidden="true"></div>
        <textarea id="editor"
          placeholder="Paste or type your text here…&#10;&#10;After clicking Check Now, click any underlined word to see suggestions."
          spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Issues panel -->
    <div class="issues-panel">
      <div id="emptyState" class="empty-state">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity=".15">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <p>Paste text and click <strong>Check Now</strong></p>
        <p class="empty-sub">Click any underlined word to see suggestions</p>
      </div>
      <div id="issuesList"></div>
    </div>

    <!-- Inline tooltip (click-on-underline) -->
    <div id="inlineTooltip" class="inline-tooltip hidden"></div>

  </main>
</div>
<script src="src/popup.js"></script>
</body>
</html>
